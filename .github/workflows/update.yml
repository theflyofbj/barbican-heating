name: Update dashboard

on:
  schedule:
    - cron: "35 8 * * *"     # every day at 09:20 UTC, i.e. after the 08:30 London post
  workflow_dispatch:          # lets you also run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new blog posts and temperatures
        run: python update_data.py
      - name: Rebuild the dashboard
        run: python build_dashboard.py
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heating_history.csv temperature_history.csv index.html
          if git diff --staged --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Daily data update"
            git push
          fi
