name: Update dashboard

on:
  schedule:
    # GitHub schedules are always in UTC, so London time moves by an hour with the clocks.
    # The blog posts at 08:30 London time (00:30 Pacific). These runs are 08:35 London in summer (07:35 UTC)
    # and 08:35 London in winter (08:35 UTC); the 10:35 UTC run catches a late post. A run with nothing new does nothing.
    - cron: "40 7,8,10 * * *"
  workflow_dispatch:          # lets you also run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new blog posts and temperatures
        run: python update_data.py
      - name: Rebuild the dashboard
        run: python build_dashboard.py
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heating_history.csv temperature_history.csv index.html
          if git diff --staged --quiet; then
            echo "Nothing changed"
          else
            git commit -m "Daily data update"
            git push
          fi
